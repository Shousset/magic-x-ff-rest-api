name: magic-x-local

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3003"
    ports:
      - "127.0.0.1:3003:3003"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      NEST_API_ORIGIN: http://api:3003
    ports:
      - "127.0.0.1:8080:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
